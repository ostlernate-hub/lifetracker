<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#E879F9"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F0ABFC"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="strongGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="frameGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B0764" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#0f0020" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#05000f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="#05000f"/>
  <rect width="512" height="512" fill="url(#bgGlow)"/>

  <!-- Subtle scanline texture -->
  <rect width="512" height="512" fill="url(#bgGlow)" opacity="0.3"/>

  <!-- ── HUD FRAME ── -->
  <!-- Outer glow frame -->
  <rect x="48" y="72" width="416" height="368" rx="10"
    fill="none" stroke="#A855F7" stroke-width="4"
    filter="url(#frameGlow)" opacity="0.9"/>
  <!-- Inner thin frame -->
  <rect x="54" y="78" width="404" height="356" rx="8"
    fill="rgba(88,28,135,0.15)" stroke="#7C3AED" stroke-width="1.2" opacity="0.7"/>

  <!-- Corner brackets — Top Left -->
  <path d="M48,120 L48,72 L96,72" fill="none" stroke="#E879F9" stroke-width="5" stroke-linecap="square" filter="url(#glow)"/>
  <!-- Corner brackets — Top Right -->
  <path d="M464,72 L416,72" fill="none" stroke="#E879F9" stroke-width="5" stroke-linecap="square" filter="url(#glow)"/>
  <path d="M464,72 L464,120" fill="none" stroke="#E879F9" stroke-width="5" stroke-linecap="square" filter="url(#glow)"/>
  <!-- Corner brackets — Bottom Left -->
  <path d="M48,392 L48,440 L96,440" fill="none" stroke="#E879F9" stroke-width="5" stroke-linecap="square" filter="url(#glow)"/>
  <!-- Corner brackets — Bottom Right -->
  <path d="M416,440 L464,440 L464,392" fill="none" stroke="#E879F9" stroke-width="5" stroke-linecap="square" filter="url(#glow)"/>

  <!-- Top center tick marks -->
  <line x1="200" y1="72" x2="230" y2="72" stroke="#C084FC" stroke-width="3" filter="url(#glow)"/>
  <line x1="282" y1="72" x2="312" y2="72" stroke="#C084FC" stroke-width="3" filter="url(#glow)"/>
  <!-- Bottom center tick marks -->
  <line x1="200" y1="440" x2="230" y2="440" stroke="#C084FC" stroke-width="3" filter="url(#glow)"/>
  <line x1="282" y1="440" x2="312" y2="440" stroke="#C084FC" stroke-width="3" filter="url(#glow)"/>

  <!-- Side center tick marks -->
  <line x1="48" y1="236" x2="48" y2="256" stroke="#9333EA" stroke-width="3" opacity="0.8"/>
  <line x1="48" y1="258" x2="48" y2="276" stroke="#9333EA" stroke-width="3" opacity="0.8"/>
  <line x1="464" y1="236" x2="464" y2="256" stroke="#9333EA" stroke-width="3" opacity="0.8"/>
  <line x1="464" y1="258" x2="464" y2="276" stroke="#9333EA" stroke-width="3" opacity="0.8"/>

  <!-- Corner sparks / electric nubs -->
  <circle cx="48" cy="72" r="5" fill="#E879F9" filter="url(#glow)"/>
  <circle cx="464" cy="72" r="5" fill="#E879F9" filter="url(#glow)"/>
  <circle cx="48" cy="440" r="5" fill="#E879F9" filter="url(#glow)"/>
  <circle cx="464" cy="440" r="5" fill="#E879F9" filter="url(#glow)"/>

  <!-- ── SHADOW MONARCH CROWN EMBLEM ── -->
  <g transform="translate(256, 134)" filter="url(#glow)">
    <!-- Crown base bar -->
    <rect x="-34" y="12" width="68" height="13" rx="2" fill="#D946EF"/>
    <!-- Left outer spike -->
    <polygon points="-32,12 -20,12 -25,-20 -36,-14" fill="#D946EF"/>
    <!-- Left inner spike -->
    <polygon points="-14,12 -2,12 -5,-4 -11,-4" fill="#D946EF"/>
    <!-- Center spike (tallest) -->
    <polygon points="-5,12 5,12 3,-26 -3,-26" fill="#E879F9"/>
    <!-- Right inner spike -->
    <polygon points="2,12 14,12 11,-4 5,-4" fill="#D946EF"/>
    <!-- Right outer spike -->
    <polygon points="20,12 32,12 36,-14 25,-20" fill="#D946EF"/>
    <!-- Left wing -->
    <path d="M-34,18 Q-58,10 -52,24 Q-44,28 -34,25" fill="#9333EA"/>
    <!-- Right wing -->
    <path d="M34,18 Q58,10 52,24 Q44,28 34,25" fill="#9333EA"/>
    <!-- Center gem -->
    <polygon points="0,-3 -6,6 0,12 6,6" fill="#38BDF8" opacity="0.9"/>
  </g>

  <!-- ── LEVEL UP text ── -->
  <text x="256" y="216"
    text-anchor="middle"
    font-family="'Courier New', Courier, monospace"
    font-size="36" font-weight="900"
    fill="#C084FC"
    filter="url(#glow)"
    letter-spacing="10">LEVEL UP</text>

  <!-- Horizontal divider line -->
  <line x1="80" y1="232" x2="432" y2="232" stroke="#6B21A8" stroke-width="1.2" opacity="0.8"/>
  <line x1="80" y1="234" x2="432" y2="234" stroke="#3B0764" stroke-width="0.8" opacity="0.5"/>

  <!-- ── Big number / XP display ── -->
  <!-- Shadow/echo -->
  <text x="259" y="334"
    text-anchor="middle"
    font-family="'Courier New', Courier, monospace"
    font-size="118" font-weight="900"
    fill="#6B21A8" opacity="0.6"
    letter-spacing="-4">100</text>
  <!-- Main number -->
  <text x="256" y="330"
    text-anchor="middle"
    font-family="'Courier New', Courier, monospace"
    font-size="118" font-weight="900"
    fill="url(#textGrad)"
    filter="url(#strongGlow)"
    letter-spacing="-4">100</text>

  <!-- Horizontal divider line -->
  <line x1="80" y1="352" x2="432" y2="352" stroke="#6B21A8" stroke-width="1.2" opacity="0.8"/>

  <!-- ── Bottom crown emblem (small) ── -->
  <g transform="translate(256, 374) scale(0.42)" filter="url(#glow)">
    <rect x="-34" y="12" width="68" height="11" rx="2" fill="#A855F7"/>
    <polygon points="-32,12 -20,12 -25,-18 -36,-12" fill="#A855F7"/>
    <polygon points="-14,12 -2,12 -5,-3 -11,-3" fill="#A855F7"/>
    <polygon points="-5,12 5,12 3,-22 -3,-22" fill="#C084FC"/>
    <polygon points="2,12 14,12 11,-3 5,-3" fill="#A855F7"/>
    <polygon points="20,12 32,12 36,-12 25,-18" fill="#A855F7"/>
  </g>

  <!-- ── SHADOW MONARCH text ── -->
  <text x="256" y="400"
    text-anchor="middle"
    font-family="'Courier New', Courier, monospace"
    font-size="18" font-weight="800"
    fill="#A855F7"
    filter="url(#frameGlow)"
    letter-spacing="4">SHADOW MONARCH</text>

  <!-- ── ARISE subtitle ── -->
  <text x="256" y="423"
    text-anchor="middle"
    font-family="'Courier New', Courier, monospace"
    font-size="13" font-weight="600"
    fill="#7C3AED"
    letter-spacing="5">POWER UNLOCKED</text>

  <!-- Electric spark lines in corners of frame -->
  <line x1="64" y1="88" x2="76" y2="100" stroke="#E879F9" stroke-width="1.5" opacity="0.7"/>
  <line x1="76" y1="88" x2="64" y2="100" stroke="#E879F9" stroke-width="1.5" opacity="0.4"/>
  <line x1="436" y1="88" x2="448" y2="100" stroke="#E879F9" stroke-width="1.5" opacity="0.7"/>
  <line x1="448" y1="88" x2="436" y2="100" stroke="#E879F9" stroke-width="1.5" opacity="0.4"/>
  <line x1="64" y1="412" x2="76" y2="424" stroke="#E879F9" stroke-width="1.5" opacity="0.7"/>
  <line x1="76" y1="412" x2="64" y2="424" stroke="#E879F9" stroke-width="1.5" opacity="0.4"/>
  <line x1="436" y1="412" x2="448" y2="424" stroke="#E879F9" stroke-width="1.5" opacity="0.7"/>
  <line x1="448" y1="412" x2="436" y2="424" stroke="#E879F9" stroke-width="1.5" opacity="0.4"/>
</svg>
