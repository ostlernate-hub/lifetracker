<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Frame neon glow -->
    <filter id="frameGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Strong number glow -->
    <filter id="numGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="20" result="b2"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="35" result="b3"/>
      <feMerge>
        <feMergeNode in="b3"/>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Soft text glow -->
    <filter id="textGlow" x="-30%" y="-50%" width="160%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Crown glow -->
    <filter id="crownGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Number gradient: bright top, dimmer bottom -->
    <linearGradient id="numGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8B4FF"/>
      <stop offset="40%" stop-color="#C77DFF"/>
      <stop offset="100%" stop-color="#7B2FBE"/>
    </linearGradient>
    <!-- Frame gradient -->
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B44FFF"/>
      <stop offset="100%" stop-color="#8B1FCC"/>
    </linearGradient>
    <!-- Background radial -->
    <radialGradient id="bgCenter" cx="50%" cy="48%" r="42%">
      <stop offset="0%" stop-color="#1A0033" stop-opacity="1"/>
      <stop offset="100%" stop-color="#05000A" stop-opacity="1"/>
    </radialGradient>
  </defs>

  <!-- ── BACKGROUND ── -->
  <rect width="512" height="512" fill="#05000A"/>
  <rect width="512" height="512" fill="url(#bgCenter)"/>

  <!-- ── OUTER HUD FRAME ── -->
  <!-- Diffuse outer glow layer -->
  <rect x="52" y="78" width="408" height="356" rx="14"
    fill="none" stroke="#8B1FCC" stroke-width="18" opacity="0.25"/>
  <!-- Main glowing border -->
  <rect x="52" y="78" width="408" height="356" rx="14"
    fill="none" stroke="url(#frameGrad)" stroke-width="3"
    filter="url(#frameGlow)"/>
  <!-- Inner subtle border -->
  <rect x="60" y="86" width="392" height="340" rx="10"
    fill="rgba(100,20,180,0.08)" stroke="#7B2FBE" stroke-width="1" opacity="0.5"/>

  <!-- ── CORNER BRACKETS ── -->
  <!-- Top-left -->
  <path d="M52,122  L52,78  L96,78"  fill="none" stroke="#C77DFF" stroke-width="5" stroke-linecap="square" filter="url(#frameGlow)"/>
  <!-- Top-right -->
  <path d="M460,78  L416,78"         fill="none" stroke="#C77DFF" stroke-width="5" stroke-linecap="square" filter="url(#frameGlow)"/>
  <path d="M460,78  L460,122"        fill="none" stroke="#C77DFF" stroke-width="5" stroke-linecap="square" filter="url(#frameGlow)"/>
  <!-- Bottom-left -->
  <path d="M52,390  L52,434  L96,434" fill="none" stroke="#C77DFF" stroke-width="5" stroke-linecap="square" filter="url(#frameGlow)"/>
  <!-- Bottom-right -->
  <path d="M416,434 L460,434 L460,390" fill="none" stroke="#C77DFF" stroke-width="5" stroke-linecap="square" filter="url(#frameGlow)"/>

  <!-- Corner diamond dots -->
  <rect x="48" y="74"  width="8" height="8" transform="rotate(45 52 78)"  fill="#D4A0FF" filter="url(#frameGlow)"/>
  <rect x="456" y="74" width="8" height="8" transform="rotate(45 460 78)" fill="#D4A0FF" filter="url(#frameGlow)"/>
  <rect x="48" y="430" width="8" height="8" transform="rotate(45 52 434)" fill="#D4A0FF" filter="url(#frameGlow)"/>
  <rect x="456" y="430" width="8" height="8" transform="rotate(45 460 434)" fill="#D4A0FF" filter="url(#frameGlow)"/>

  <!-- Top edge center tick -->
  <line x1="224" y1="78" x2="248" y2="78" stroke="#A855F7" stroke-width="3" filter="url(#textGlow)"/>
  <line x1="264" y1="78" x2="288" y2="78" stroke="#A855F7" stroke-width="3" filter="url(#textGlow)"/>
  <!-- Bottom edge center tick -->
  <line x1="224" y1="434" x2="248" y2="434" stroke="#A855F7" stroke-width="3" filter="url(#textGlow)"/>
  <line x1="264" y1="434" x2="288" y2="434" stroke="#A855F7" stroke-width="3" filter="url(#textGlow)"/>
  <!-- Side ticks -->
  <line x1="52" y1="248" x2="52" y2="264" stroke="#8B2FC9" stroke-width="3"/>
  <line x1="460" y1="248" x2="460" y2="264" stroke="#8B2FC9" stroke-width="3"/>

  <!-- ── SHADOW MONARCH CROWN EMBLEM (top, large) ── -->
  <g transform="translate(256, 136)" filter="url(#crownGlow)">
    <!-- Crown base bar -->
    <rect x="-38" y="14" width="76" height="14" rx="2" fill="#C77DFF"/>
    <!-- Left outer spike -->
    <polygon points="-36,14 -22,14 -27,-22 -40,-15" fill="#C77DFF"/>
    <!-- Left inner spike -->
    <polygon points="-16,14  -4,14  -7, -6 -12, -6" fill="#C77DFF"/>
    <!-- Center spike (tallest) -->
    <polygon points=" -6,14   6,14   4,-30  -4,-30" fill="#E2B4FF"/>
    <!-- Right inner spike -->
    <polygon points="  4,14  16,14  12, -6   7, -6" fill="#C77DFF"/>
    <!-- Right outer spike -->
    <polygon points=" 22,14  36,14  40,-15  27,-22" fill="#C77DFF"/>
    <!-- Left wing -->
    <path d="M-38,20 Q-66,12 -58,26 Q-48,30 -38,27" fill="#9B30FF" opacity="0.85"/>
    <!-- Right wing -->
    <path d="M 38,20 Q 66,12  58,26 Q 48,30  38,27" fill="#9B30FF" opacity="0.85"/>
    <!-- Center gem (blue accent) -->
    <polygon points="0,0 -7,10 0,18 7,10" fill="#7FDBFF" opacity="0.95"/>
  </g>

  <!-- ── LEVEL UP TEXT ── -->
  <text x="256" y="210"
    text-anchor="middle"
    font-family="Arial Black, Arial, sans-serif"
    font-size="38" font-weight="900"
    fill="#DEB8FF"
    filter="url(#textGlow)"
    letter-spacing="10">LEVEL UP</text>

  <!-- Divider -->
  <line x1="76" y1="225" x2="436" y2="225" stroke="#5A1A8A" stroke-width="1.5"/>
  <line x1="76" y1="226" x2="436" y2="226" stroke="#3A0A60" stroke-width="0.8" opacity="0.6"/>

  <!-- ── BIG "100" ── -->
  <!-- Deep shadow for depth -->
  <text x="259" y="338"
    text-anchor="middle"
    font-family="Arial Black, Arial, sans-serif"
    font-size="148" font-weight="900"
    fill="#4A0080" opacity="0.9"
    letter-spacing="-6">100</text>
  <!-- Main glowing number -->
  <text x="256" y="334"
    text-anchor="middle"
    font-family="Arial Black, Arial, sans-serif"
    font-size="148" font-weight="900"
    fill="url(#numGrad)"
    filter="url(#numGlow)"
    letter-spacing="-6">100</text>

  <!-- Divider -->
  <line x1="76" y1="354" x2="436" y2="354" stroke="#5A1A8A" stroke-width="1.5"/>

  <!-- ── SMALL CROWN ── -->
  <g transform="translate(256, 374) scale(0.38)" filter="url(#crownGlow)">
    <rect x="-38" y="14" width="76" height="12" rx="2" fill="#9B30FF"/>
    <polygon points="-36,14 -22,14 -27,-20 -40,-13" fill="#9B30FF"/>
    <polygon points="-16,14  -4,14  -7, -5 -12, -5" fill="#9B30FF"/>
    <polygon points=" -6,14   6,14   4,-26  -4,-26" fill="#C077FF"/>
    <polygon points="  4,14  16,14  12, -5   7, -5" fill="#9B30FF"/>
    <polygon points=" 22,14  36,14  40,-13  27,-20" fill="#9B30FF"/>
    <path d="M-38,18 Q-60,10 -54,22 Q-44,26 -38,23" fill="#7B20EE" opacity="0.8"/>
    <path d="M 38,18 Q 60,10  54,22 Q 44,26  38,23" fill="#7B20EE" opacity="0.8"/>
  </g>

  <!-- ── SHADOW MONARCH ── -->
  <text x="256" y="406"
    text-anchor="middle"
    font-family="Arial Black, Arial, sans-serif"
    font-size="19" font-weight="900"
    fill="#C077FF"
    filter="url(#textGlow)"
    letter-spacing="5">SHADOW MONARCH</text>

  <!-- ── POWER UNLOCKED ── -->
  <text x="256" y="428"
    text-anchor="middle"
    font-family="Arial, sans-serif"
    font-size="13" font-weight="700"
    fill="#7B44AA"
    letter-spacing="4">POWER UNLOCKED</text>
</svg>
