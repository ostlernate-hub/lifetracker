<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#D946EF"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="#06061a"/>

  <!-- Ambient radial glow -->
  <radialGradient id="ambientGlow" cx="50%" cy="45%" r="45%">
    <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.25"/>
    <stop offset="100%" stop-color="#06061a" stop-opacity="0"/>
  </radialGradient>
  <rect width="512" height="512" fill="url(#ambientGlow)"/>

  <!-- Crown base bar -->
  <rect x="124" y="306" width="264" height="46" rx="3" fill="url(#g)" filter="url(#glow)"/>

  <!-- Left outer spike -->
  <polygon points="132,306 170,306 152,142 116,148" fill="url(#g)" filter="url(#glow)"/>

  <!-- Left inner notch (creates the crown indent) -->
  <polygon points="170,306 200,306 195,230 175,230" fill="#06061a"/>

  <!-- Left inner spike -->
  <polygon points="200,306 232,306 220,208 208,208" fill="url(#g)" filter="url(#glow)"/>

  <!-- Center spike (tallest) -->
  <polygon points="232,306 280,306 266,104 246,104" fill="url(#g)" filter="url(#glow)"/>

  <!-- Right inner spike -->
  <polygon points="280,306 312,306 304,208 292,208" fill="url(#g)" filter="url(#glow)"/>

  <!-- Right inner notch -->
  <polygon points="312,306 342,306 337,230 317,230" fill="#06061a"/>

  <!-- Right outer spike -->
  <polygon points="342,306 380,306 396,148 360,142" fill="url(#g)" filter="url(#glow)"/>

  <!-- Blue highlight edges (left faces of spikes) -->
  <line x1="116" y1="148" x2="132" y2="306" stroke="#38BDF8" stroke-width="3.5" opacity="0.9" filter="url(#softglow)"/>
  <line x1="208" y1="208" x2="200" y2="306" stroke="#38BDF8" stroke-width="2" opacity="0.65"/>
  <line x1="246" y1="104" x2="232" y2="306" stroke="#38BDF8" stroke-width="2.5" opacity="0.75" filter="url(#softglow)"/>
  <line x1="124" y1="306" x2="124" y2="352" stroke="#38BDF8" stroke-width="3" opacity="0.8"/>

  <!-- Diamond gem at crown apex -->
  <polygon points="256,118 242,148 256,162 270,148" fill="#38BDF8" opacity="0.95" filter="url(#glow)"/>

  <!-- Gem accent dots on outer spike tips -->
  <circle cx="134" cy="142" r="8" fill="#38BDF8" opacity="0.85" filter="url(#softglow)"/>
  <circle cx="378" cy="142" r="8" fill="#7C3AED" opacity="0.7"/>

  <!-- Small crossbar accent on center spike -->
  <rect x="240" y="180" width="32" height="5" rx="1" fill="#38BDF8" opacity="0.6"/>

  <!-- ARISE text -->
  <text x="256" y="424"
    text-anchor="middle"
    font-family="'Courier New', Courier, monospace"
    font-size="64"
    font-weight="900"
    fill="url(#g)"
    filter="url(#glow)"
    letter-spacing="10">ARISE</text>

  <!-- Decorative underline -->
  <rect x="158" y="434" width="196" height="2" rx="1" fill="url(#g)" opacity="0.75"/>
  <rect x="218" y="440" width="76" height="1" rx="1" fill="#38BDF8" opacity="0.5"/>
</svg>
